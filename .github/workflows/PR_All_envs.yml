name: Verify all configured firmware boards

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; leave empty to verify the selected branch
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: all-boards-${{ github.ref }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.boards.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - id: boards
        name: Read the actual PlatformIO environment matrix
        run: |
          python - <<'PY'
          import json, os
          from platformio.project.config import ProjectConfig
          boards = sorted(ProjectConfig.get_instance().envs())
          if not boards:
              raise SystemExit('No board environments found')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('boards=' + json.dumps(boards) + '\n')
          print('Configured environments:', len(boards))
          PY

  firmware:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: ${{ fromJSON(needs.discover.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          pip install platformio==6.2.0
      - name: Build firmware
        run: python3 tools/build_firmware.py -e '${{ matrix.board }}'
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: Bruce-${{ matrix.board }}.bin
          retention-days: 3
          if-no-files-found: error
