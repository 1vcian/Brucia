name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the comment names the tag.

jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [lilygo-t-embed-cc1101, m5stack-core4mb, m5stack-cardputer]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build firmware
        run: python3 tools/build_firmware.py -e ${{ matrix.board }}
      - name: AAC SBR noise bounds regression
        run: python3 tools/test_audio_noise_bounds.py -e ${{ matrix.board }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: brucia-firmware-${{ matrix.board }}
          path: Bruce-${{ matrix.board }}.bin
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    env:
      # AGP 9.3.3 default build-tools; compileSdk 37, targetSdk 36 (android/app/build.gradle.kts).
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # JDK 21 LTS: the minimum for Paparazzi 2.0 (screenshot tests in testDebugUnitTest);
      # Gradle 9.7.1, AGP 9.3.3 and Kotlin 2.4.21 need 17+ (app bytecode targets 17).
      # Local builds with JDK 23 are also used.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      # Explicit SDK setup instead of relying on whatever the runner image ships.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      # verifyPaparazziDebug runs the unit tests with paparazzi.test.verify set, so every screenshot
      # test is compared with its committed baseline (src/test/snapshots). The plain
      # testDebugUnitTest task only renders: Paparazzi 2.0.0-alpha05.1 verifies nothing without
      # that property, so a changed screen would pass unnoticed.
      - name: Unit tests and screenshot verification against baselines
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:verifyPaparazziDebug --no-daemon
      - name: Upload unit-test and screenshot-diff reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: brucia-unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/paparazzi/failures/
          if-no-files-found: ignore
      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon
      # No keystore.properties in CI: the release APK is unsigned by design.
      # Signing stays local (release.sh).
      - name: Build debug and unsigned release APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Check APK identity (applicationId, VERSION, min/target SDK, debuggable)
        run: |
          aapt2="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          python3 tools/check_apk_identity.py --aapt2 "$aapt2" --build-type debug \
            android/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/check_apk_identity.py --aapt2 "$aapt2" --build-type release \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
      # Signed with the runner's throwaway debug key: cannot update an install
      # signed with any other key.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: brucia-app-debug-ci-debug-key
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Unsigned: not installable until signed locally.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: brucia-app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  # Instrumented tests on an emulator: Room migrations, MainActivity receivers, ConnectionService
  # foreground/wake lock, MITM rows and the simulated-device companion flow (navigation, stream,
  # re-negotiation, Stop, Disconnect). An emulator does not replace real USB/radio peripherals.
  android-instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      # Hardware acceleration for the x86_64 emulator on the hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Instrumented tests (connectedDebugAndroidTest)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect
          working-directory: android
          script: |
            adb logcat -c || true
            adb logcat -v threadtime > ../instrumented-logcat.txt 2>&1 &
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload instrumented-test reports and logcat
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: brucia-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            instrumented-logcat.txt
          if-no-files-found: warn

  protocol-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.20.0'
      - run: pip install pyserial
      - name: Build, release, dependency, database and APK-identity regressions
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Website release and installer logic
        run: node --test tools/test_site_release.cjs
      - name: Firmware base64 codec regression
        run: python3 tools/test_firmware_codec.py
      - name: Firmware file transfer regression
        run: python3 tools/test_firmware_storage.py
      - name: Firmware transactional upload failure and recovery regression
        run: python3 tools/test_firmware_upload.py
      - name: Firmware frame reader regression
        run: python3 tools/test_firmware_framing.py
      - name: Firmware iButton core regression (host C++)
        run: python3 tools/test_firmware_ibutton.py
      - name: End-to-end protocol test (mock device + client)
        run: python3 tools/test_protocol_e2e.py
