name: build

on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'android/**', 'platformio.ini', 'boards/**' ]
  workflow_dispatch: {}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e lilygo-t-embed-cc1101
      - name: Stage merged image for the web flasher
        run: cp .pio/build/lilygo-t-embed-cc1101/firmware.factory.bin docs/firmware/brucia-t-embed-cc1101.bin
      - uses: actions/upload-artifact@v4
        with:
          name: brucia-firmware
          path: .pio/build/lilygo-t-embed-cc1101/firmware.factory.bin

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests (offload logic)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brucia-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  protocol-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyserial
      - name: End-to-end protocol test (mock device + client)
        run: python3 tools/test_protocol_e2e.py
