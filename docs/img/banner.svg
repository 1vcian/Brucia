<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Brucia - the phone is the brain, the ESP32 is the antenna" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E23E00"/>
      <stop offset="0.5" stop-color="#FF6D1A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#FF6D1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FF6D1A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6D1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <!-- flame, centered above the wordmark -->
  <g transform="translate(600 56) scale(0.95)">
    <path transform="translate(-60 0)" fill="url(#flame)" d="M60 8c6 22-14 30-14 52 0 7 3 13 8 17-2-6-1-14 6-19-3 14 10 18 10 31 0 13-9 23-20 23-14 0-26-11-26-27 0-20 16-28 20-45 3-12 6-24 16-32z"/>
  </g>
  <text x="600" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="104" font-weight="800" fill="url(#txt)" letter-spacing="2">Brucia</text>
  <text x="600" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#C7C7CF" letter-spacing="3">THE PHONE IS THE BRAIN  ·  THE ESP32 IS THE ANTENNA</text>
</svg>
