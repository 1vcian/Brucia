
[env:lilygo-t-lora-pager]
board = lilygo-t-lora-pager
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/lilygo-t-lora-pager>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-lora-pager
	-O2
	-DMIC_SPM1423
	-DCGRAM_OFFSET
	-DCORE_DEBUG_LEVEL=1

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.0
	lewisxhe/SensorLib@0.3.4
	adafruit/Adafruit TCA8418 @ 1.0.2
	# pschatzmann/arduino-audio-driver v0.1.3 (tag v0.1.3 = commit bfce38bd; same archive contents)
    https://github.com/pschatzmann/arduino-audio-driver/archive/bfce38bdc31428f2609b084f4fd67e4bf1f6ae4b.zip
